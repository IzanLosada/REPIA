<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mapa de puntos de recogida</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      crossorigin=""
    />
    <style>
      :root {
        --bg: #0a0c0a;
        --panel: #181c16;
        --panel-2: #1f241c;
        --border: #2a3227;
        --green: #4a8c3f;
        --green-light: #90d47f;
        --text: #f0f4ef;
        --muted: #7a8f76;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "DM Sans", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      header {
        padding: 24px 32px;
        border-bottom: 1px solid var(--border);
        background: #111410;
      }

      header h1 {
        margin: 0;
        font-family: "Syne", sans-serif;
        font-size: 1.9rem;
        letter-spacing: -0.03em;
      }

      header h1 span {
        color: var(--green-light);
      }

      header p {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .page {
        max-width: 1100px;
        margin: 0 auto;
        padding: 24px 16px 40px;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 20px;
        margin-bottom: 18px;
      }

      .card h2 {
        margin: 0 0 10px;
        font-family: "Syne", sans-serif;
        font-size: 1.2rem;
      }

      .intro {
        margin: 0 0 14px;
        color: #c8d4c5;
        line-height: 1.6;
      }

      .help-box {
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--panel-2);
        color: #c8d4c5;
        line-height: 1.6;
      }

      .help-box code {
        display: inline-block;
        margin-top: 6px;
        padding: 4px 6px;
        border-radius: 6px;
        background: rgba(74, 140, 63, 0.15);
        color: var(--green-light);
      }

      #mapa {
        height: 72vh;
        min-height: 420px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #dce7d8;
      }

      .note {
        margin-top: 12px;
        color: var(--muted);
        font-size: 0.92rem;
      }

      .leaflet-container {
        font-family: "DM Sans", sans-serif;
      }

      .leaflet-control-zoom a {
        background: var(--panel);
        color: var(--text);
        border-color: var(--border);
      }

      .leaflet-popup-content-wrapper,
      .leaflet-popup-tip {
        background: var(--panel);
        color: var(--text);
      }

      .popup-title {
        font-weight: 700;
        color: var(--green-light);
        margin-bottom: 4px;
      }

      .popup-text {
        color: #c8d4c5;
        font-size: 0.92rem;
        line-height: 1.5;
      }

      @media (max-width: 700px) {
        header {
          padding: 20px;
        }

        header h1 {
          font-size: 1.5rem;
        }

        .page {
          padding: 14px;
        }

        .card {
          padding: 16px;
        }

        #mapa {
          height: 65vh;
          min-height: 360px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Re<span>Pia</span></h1>
      <p>Mapa simple de puntos de recogida</p>
    </header>

    <main class="page">
      <section class="card">
        <h2>Mapa de recogida</h2>
        <p class="intro">
          Aquí puedes ver los puntos de recogida disponibles en diferentes ciudades. Haz clic en cada marcador para obtener más información sobre la ubicación y dirección de cada punto.
        </p>

      </section>

      <section class="card">
        <div id="mapa"></div>
      </section>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script>
      const puntosRecogida = [
        { nombre: "Madrid Centro", ciudad: "Madrid", direccion: "Calle Arenal 8", lat: 40.4172, lng: -3.7036 },
        { nombre: "Barcelona Eixample", ciudad: "Barcelona", direccion: "Carrer del Consell de Cent 321", lat: 41.3912, lng: 2.1678 },
        { nombre: "Valencia Ruzafa", ciudad: "Valencia", direccion: "Calle Sueca 42", lat: 39.4628, lng: -0.3716 },
        { nombre: "Sevilla Nervion", ciudad: "Sevilla", direccion: "Avenida de la Buhaira 12", lat: 37.3877, lng: -5.9723 },
        { nombre: "Malaga Centro", ciudad: "Malaga", direccion: "Explanada de la Estacion 4", lat: 36.7134, lng: -4.4328 },
        { nombre: "Bilbao Abando", ciudad: "Bilbao", direccion: "Gran Via 41", lat: 43.2632, lng: -2.9349 },
        { nombre: "Zaragoza Delicias", ciudad: "Zaragoza", direccion: "Avenida de Navarra 54", lat: 41.6479, lng: -0.9013 },
        { nombre: "Palma Santa Catalina", ciudad: "Palma", direccion: "Carrer de Sant Magi 64", lat: 39.5698, lng: 2.6385 }
      ];

      const mapa = L.map("mapa").setView([40.2, -3.7], 6);

      L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
        attribution: "&copy; OpenStreetMap contributors &copy; CARTO",
        subdomains: "abcd"
      }).addTo(mapa);

      const limites = [];

      puntosRecogida.forEach((punto) => {
        const marcador = L.circleMarker([punto.lat, punto.lng], {
          radius: 8,
          color: "#2d5c27",
          weight: 2,
          fillColor: "#6bbf5a",
          fillOpacity: 0.9
        }).addTo(mapa);

        marcador.bindPopup(
          '<div class="popup-title">' +
            escaparHtml(punto.nombre) +
            '</div><div class="popup-text">' +
            escaparHtml(punto.ciudad) +
            "<br>" +
            escaparHtml(punto.direccion) +
            "</div>"
        );

        limites.push([punto.lat, punto.lng]);
      });

      if (limites.length > 0) {
        mapa.fitBounds(limites, { padding: [30, 30] });
      }

      function escaparHtml(texto) {
        return String(texto).replace(/[&<>"']/g, (caracter) => {
          const entidades = {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
          };

          return entidades[caracter];
        });
      }
    </script>
  </body>
</html>
