<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RePia - Botiga de productes sostenibles</title>
    <link rel="icon" type="image/x-icon" href="img/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0-beta.2/css/bootstrap.min.css" />
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/4.12.1/firebase.js"></script>
    <script src="https://www.gstatic.com/firebasejs/4.12.1/firebase-firestore.js"></script>

    <style>
      /* VARIABLES DE COLOR - Estètica verda fosca consistent */
      :root {
        --black:        #0a0c0a;
        --surface-1:    #111410;
        --surface-2:    #181c16;
        --surface-3:    #1f241c;
        --border:       #2a3227;
        --green-dark:   #2d5c27;
        --green-mid:    #4a8c3f;
        --green-bright: #6bbf5a;
        --green-light:  #90d47f;
        --white:        #f0f4ef;
        --grey-1:       #c8d4c5;
        --grey-2:       #7a8f76;
        --grey-3:       #3d4e3a;
      }

      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        height: 100%;
        background-color: var(--black);
        color: var(--white);
        font-family: 'DM Sans', sans-serif;
        font-size: 15px;
        line-height: 1.6;
      }

      /* Fons de soroll subtil */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
        background-size: 180px;
        pointer-events: none;
        z-index: 0;
        opacity: 0.6;
      }

      /* HEADER */
      header {
        position: relative;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 20px 32px;
        border-bottom: 1px solid var(--border);
        background: linear-gradient(180deg, rgba(45,92,39,0.12) 0%, transparent 100%);
      }

      header .logo-wrap {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      header h1 {
        font-family: 'Syne', sans-serif;
        font-weight: 800;
        font-size: 1.5rem;
        letter-spacing: -0.02em;
        color: var(--white);
        margin: 0;
      }

      header h1 span {
        color: var(--green-bright);
      }

      /* ICONA DE CARRITO EN EL HEADER */
      .carrito-header {
        position: relative;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 8px;
        transition: all 0.2s;
      }

      .carrito-header:hover {
        border-color: var(--green-mid);
        background: var(--surface-3);
      }

      .carrito-header::before {
        content: '';
        display: block;
        width: 20px;
        height: 18px;
        background: linear-gradient(to bottom, 
          transparent 0%, 
          transparent 35%,
          var(--green-bright) 35%,
          var(--green-bright) 65%,
          transparent 65%),
          linear-gradient(to right,
          var(--green-bright) 15%,
          transparent 15%,
          transparent 85%,
          var(--green-bright) 85%);
      }

      .carrito-badge {
        position: absolute;
        top: -8px;
        right: -8px;
        background: var(--green-bright);
        color: var(--black);
        border-radius: 50%;
        width: 24px;
        height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.75rem;
        font-weight: 700;
      }

      /* CONTINGUT PRINCIPAL */
      .page-wrap {
        position: relative;
        z-index: 1;
        min-height: calc(100vh - 60px);
        display: flex;
        flex-direction: column;
        padding: 40px 24px 80px;
      }

      /* BARRA DE FILTRES I CERCA */
      .filtres-section {
        width: 100%;
        max-width: 1200px;
        margin: 0 auto 40px;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }

      .filtres-section .search-group {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .filtres-section .search-group input {
        flex: 1;
        background: var(--surface-3);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 12px;
        color: var(--white);
        font-family: 'DM Sans', sans-serif;
      }

      .filtres-section .search-group input::placeholder {
        color: var(--grey-3);
      }

      .filtres-section .search-group input:focus {
        outline: none;
        border-color: var(--green-mid);
        box-shadow: 0 0 0 3px rgba(74,140,63,0.2);
      }

      /* ICONA DE LUPA BÀSICA */
      .search-icon {
        color: var(--grey-2);
        font-size: 1.1rem;
        display: block;
        width: 20px;
        height: 20px;
        border: 2px solid var(--grey-2);
        border-radius: 50%;
        position: relative;
        flex-shrink: 0;
      }

      .search-icon::after {
        content: '';
        position: absolute;
        width: 2px;
        height: 6px;
        background: var(--grey-2);
        bottom: -5px;
        right: -2px;
        transform: rotate(45deg);
      }

      .filtres-section label {
        font-size: 0.72rem;
        font-weight: 500;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--grey-2);
        display: block;
        margin-bottom: 8px;
      }

      .filtres-section select {
        width: 100%;
        background: var(--surface-3);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 12px;
        color: var(--white);
        font-family: 'DM Sans', sans-serif;
      }

      .filtres-section select:focus {
        outline: none;
        border-color: var(--green-mid);
        box-shadow: 0 0 0 3px rgba(74,140,63,0.2);
      }

      /* GRID DE PRODUCTES */
      .products-container {
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 24px;
      }

      /* TARJETA DE PRODUCTE */
      .product-card {
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
        transition: all 0.2s ease;
        cursor: pointer;
        display: flex;
        flex-direction: column;
      }

      .product-card:hover {
        border-color: var(--green-mid);
        box-shadow: 0 4px 20px rgba(74,140,63,0.15);
      }

      /* Area de imatge del producte - placeholder simple */
      .product-image {
        width: 100%;
        height: 200px;
        background: linear-gradient(135deg, var(--green-dark) 0%, var(--green-mid) 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.5rem;
        color: rgba(255,255,255,0.2);
        font-weight: 700;
        font-family: 'Syne', sans-serif;
      }

      .product-info {
        padding: 16px;
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      .product-title {
        font-family: 'Syne', sans-serif;
        font-weight: 700;
        font-size: 1rem;
        color: var(--white);
        margin-bottom: 6px;
      }

      .product-category {
        font-size: 0.7rem;
        color: var(--green-bright);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 8px;
        font-weight: 600;
      }

      .product-description {
        font-size: 0.85rem;
        color: var(--grey-2);
        margin-bottom: 12px;
        flex: 1;
      }

      .product-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: auto;
      }

      .product-price {
        font-family: 'Syne', sans-serif;
        font-weight: 700;
        font-size: 1.2rem;
        color: var(--green-bright);
      }

      .product-btn-add {
        background: var(--green-mid);
        color: white;
        border: none;
        border-radius: 6px;
        padding: 8px 14px;
        font-size: 0.8rem;
        cursor: pointer;
        font-weight: 500;
        transition: background 0.2s;
      }

      .product-btn-add:hover {
        background: var(--green-bright);
      }

      /* MODAL DETALLS DE PRODUCTE */
      .modal-backdrop {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.6);
        z-index: 100;
      }

      .modal-backdrop.show {
        display: block;
      }

      .modal-content-wrap {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 32px;
        max-width: 600px;
        width: 90%;
        z-index: 101;
        max-height: 80vh;
        overflow-y: auto;
      }

      .modal-close {
        position: absolute;
        top: 16px;
        right: 16px;
        background: none;
        border: none;
        color: var(--grey-1);
        font-size: 1.5rem;
        cursor: pointer;
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .modal-close::before {
        content: '';
        position: absolute;
        width: 18px;
        height: 2px;
        background: var(--grey-1);
        transform: rotate(45deg);
      }

      .modal-close::after {
        content: '';
        position: absolute;
        width: 18px;
        height: 2px;
        background: var(--grey-1);
        transform: rotate(-45deg);
      }

      .modal-header-title {
        font-family: 'Syne', sans-serif;
        font-weight: 700;
        font-size: 1.5rem;
        color: var(--white);
        margin-bottom: 8px;
      }

      .modal-header-category {
        font-size: 0.7rem;
        color: var(--green-bright);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 16px;
        font-weight: 600;
      }

      .modal-image {
        background: linear-gradient(135deg, var(--green-dark) 0%, var(--green-mid) 100%);
        border-radius: 8px;
        padding: 40px;
        text-align: center;
        font-size: 3rem;
        margin-bottom: 20px;
        color: rgba(255,255,255,0.2);
        font-weight: 700;
        font-family: 'Syne', sans-serif;
      }

      .modal-description {
        color: var(--grey-1);
        margin-bottom: 24px;
        line-height: 1.8;
      }

      .modal-footer {
        display: flex;
        gap: 12px;
        margin-top: 24px;
      }

      .modal-btn {
        flex: 1;
        padding: 12px 16px;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
      }

      .modal-btn-primary {
        background: linear-gradient(135deg, var(--green-dark) 0%, var(--green-mid) 100%);
        color: white;
        border: 1px solid var(--green-mid);
      }

      .modal-btn-primary:hover {
        background: linear-gradient(135deg, var(--green-mid) 0%, var(--green-bright) 100%);
      }

      /* CARRICO LATERAL */
      .cart-sidebar {
        position: fixed;
        right: -360px;
        top: 0;
        width: 360px;
        height: 100vh;
        background: var(--surface-1);
        border-left: 1px solid var(--border);
        z-index: 200;
        transition: right 0.3s ease;
        display: flex;
        flex-direction: column;
      }

      .cart-sidebar.show {
        right: 0;
      }

      .cart-header {
        padding: 20px;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .cart-header h3 {
        font-family: 'Syne', sans-serif;
        font-weight: 700;
        font-size: 1.2rem;
        color: var(--white);
        margin: 0;
      }

      .cart-close-btn {
        background: none;
        border: none;
        color: var(--grey-1);
        font-size: 1.5rem;
        cursor: pointer;
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      .cart-close-btn::before {
        content: '';
        position: absolute;
        width: 18px;
        height: 2px;
        background: var(--grey-1);
        transform: rotate(45deg);
      }

      .cart-close-btn::after {
        content: '';
        position: absolute;
        width: 18px;
        height: 2px;
        background: var(--grey-1);
        transform: rotate(-45deg);
      }

      .cart-items {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
      }

      /* ARTICLE AL CARRICO */
      .cart-item {
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .cart-item-info {
        flex: 1;
      }

      .cart-item-title {
        font-weight: 600;
        color: var(--white);
        font-size: 0.9rem;
        margin-bottom: 4px;
      }

      .cart-item-price {
        font-size: 0.85rem;
        color: var(--green-bright);
        font-weight: 700;
      }

      .cart-item-qty {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-left: 12px;
      }

      .cart-item-qty button {
        background: var(--surface-3);
        border: 1px solid var(--border);
        color: var(--white);
        width: 24px;
        height: 24px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.8rem;
        font-weight: 600;
      }

      .cart-item-qty button:hover {
        background: var(--green-dark);
      }

      .cart-item-remove {
        background: none;
        border: none;
        color: #e74c3c;
        cursor: pointer;
        font-size: 1rem;
        margin-left: 8px;
        width: 24px;
        height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      .cart-item-remove::before {
        content: '';
        position: absolute;
        width: 12px;
        height: 2px;
        background: #e74c3c;
        transform: rotate(45deg);
      }

      .cart-item-remove::after {
        content: '';
        position: absolute;
        width: 12px;
        height: 2px;
        background: #e74c3c;
        transform: rotate(-45deg);
      }

      /* FOOTER DE CARRICO */
      .cart-footer {
        border-top: 1px solid var(--border);
        padding: 16px;
        background: var(--surface-2);
      }

      .cart-total {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--border);
      }

      .cart-total-label {
        font-weight: 600;
        color: var(--grey-1);
      }

      .cart-total-amount {
        font-family: 'Syne', sans-serif;
        font-weight: 700;
        font-size: 1.3rem;
        color: var(--green-bright);
      }

      .cart-checkout-btn {
        width: 100%;
        background: linear-gradient(135deg, var(--green-dark) 0%, var(--green-mid) 100%);
        color: white;
        border: 1px solid var(--green-mid);
        border-radius: 8px;
        padding: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        margin-bottom: 8px;
      }

      .cart-checkout-btn:hover {
        background: linear-gradient(135deg, var(--green-mid) 0%, var(--green-bright) 100%);
      }

      .cart-continue-btn {
        width: 100%;
        background: transparent;
        color: var(--green-light);
        border: 1px solid var(--green-mid);
        border-radius: 8px;
        padding: 10px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
      }

      .cart-continue-btn:hover {
        background: rgba(74,140,63,0.1);
      }

      .cart-empty {
        text-align: center;
        padding: 40px 20px;
        color: var(--grey-2);
      }

      /* ALERTA */
      #alert {
        display: none;
        position: fixed;
        top: 20px;
        right: 20px;
        background: #27ae60;
        color: white;
        padding: 16px 20px;
        border-radius: 8px;
        z-index: 300;
        animation: slideIn 0.3s ease;
      }

      #alert.alert-danger {
        background: #e74c3c;
      }

      @keyframes slideIn {
        from { opacity: 0; transform: translateX(100px); }
        to { opacity: 1; transform: translateX(0); }
      }

      /* FOOTER */
      footer {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        text-align: center;
        padding: 12px;
        font-size: 0.8rem;
        color: var(--grey-2);
        background: var(--surface-1);
        border-top: 1px solid var(--border);
        z-index: 5;
      }

      /* RESPONSIVE */
      @media (max-width: 768px) {
        .filtres-section {
          grid-template-columns: 1fr;
        }

        .products-container {
          grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
          gap: 16px;
        }

        .cart-sidebar {
          width: 100%;
          right: -100%;
        }

        header h1 {
          font-size: 1.2rem;
        }
      }
    </style>
  </head>
  <body>
    <!-- HEADER -->
    <header>
      <div class="logo-wrap">
        <h1>Re<span>Pia</span></h1>
      </div>
      <div class="carrito-header" id="carritoBtn" onclick="toggleCarrito()">
        <span class="carrito-badge" id="carrioBadge" style="display: none;">0</span>
      </div>
    </header>

    <!-- CONTINGUT PRINCIPAL -->
    <div class="page-wrap">
      <!-- SECCIÓ DE FILTRES I CERCA -->
      <div class="filtres-section">
        <!-- BUSCADOR PER NOM -->
        <div>
          <label>Cercar producte</label>
          <div class="search-group">
            <span class="search-icon"></span>
            <input 
              type="text" 
              id="searchInput" 
              placeholder="Cercar per nom..."
              oninput="filtrarProductes()"
            />
          </div>
        </div>

        <!-- FILTRO DE CATEGORIA -->
        <div>
          <label>Filtrar per categoria</label>
          <select id="categoryFilter" onchange="filtrarProductes()">
            <option value="">Totes les categories</option>
            <!-- Les opcions es carregaran dinàmicament des de Firestore -->
          </select>
        </div>
      </div>

      <!-- GRID DE PRODUCTES -->
      <div class="products-container" id="productsGrid">
        <!-- Els productes es carregaran aquí dinamicament -->
      </div>
    </div>

    <!-- MODAL DE DETALLS DEL PRODUCTE -->
    <div class="modal-backdrop" id="productModal" onclick="closeProductModal()">
      <div class="modal-content-wrap" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="closeProductModal()"></button>
        <h2 class="modal-header-title" id="modalTitle">Títol del producte</h2>
        <div class="modal-header-category" id="modalCategory">Categoria</div>
        
        <!-- Imatge del producte (placeholder simple) -->
        <div class="modal-image" id="modalImage">P</div>

        <!-- Descripció extesa -->
        <p class="modal-description" id="modalDescription">Descripció del producte</p>

        <!-- PREU -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
          <span style="font-size: 0.9rem; color: var(--grey-2);">Preu unitari:</span>
          <span style="font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1.4rem; color: var(--green-bright);" id="modalPrice">0,00€</span>
        </div>

        <!-- QUANTITAT -->
        <div style="margin-bottom: 20px;">
          <label style="font-size: 0.85rem; color: var(--grey-2); display: block; margin-bottom: 8px;">Quantitat:</label>
          <div style="display: flex; align-items: center; gap: 8px;">
            <button onclick="decrementarQuantitat()" style="background: var(--surface-3); border: 1px solid var(--border); color: var(--white); width: 40px; height: 40px; border-radius: 6px; cursor: pointer; font-size: 1.1rem; font-weight: 600;">-</button>
            <input 
              type="number" 
              id="modalQuantity" 
              value="1" 
              min="1"
              style="width: 60px; background: var(--surface-3); border: 1px solid var(--border); color: var(--white); padding: 8px; border-radius: 6px; text-align: center;"
              onchange="validarQuantitat()"
            />
            <button onclick="incrementarQuantitat()" style="background: var(--surface-3); border: 1px solid var(--border); color: var(--white); width: 40px; height: 40px; border-radius: 6px; cursor: pointer; font-size: 1.1rem; font-weight: 600;">+</button>
          </div>
        </div>

        <!-- BOTONS D'ACCIÓ -->
        <div class="modal-footer">
          <button class="modal-btn modal-btn-primary" onclick="afegirAlCarrito()">
            Afegir al carrico
          </button>
        </div>
      </div>
    </div>

    <!-- CARRICO LATERAL -->
    <div class="cart-sidebar" id="cartSidebar">
      <!-- HEADER DEL CARRICO -->
      <div class="cart-header">
        <h3>Carrico (0)</h3>
        <button class="cart-close-btn" onclick="toggleCarrito()"></button>
      </div>

      <!-- ARTICLES DEL CARRICO -->
      <div class="cart-items" id="cartItemsContainer">
        <div class="cart-empty">
          El carrico està buit
        </div>
      </div>

      <!-- FOOTER DEL CARRICO (TOTAL I BOTONS) -->
      <div class="cart-footer">
        <div class="cart-total">
          <span class="cart-total-label">TOTAL:</span>
          <span class="cart-total-amount" id="cartTotal">0,00€</span>
        </div>
        <button class="cart-checkout-btn" onclick="simularCompra()">
          Procedir a la compra
        </button>
        <button class="cart-continue-btn" onclick="toggleCarrito()">
          Continuar comprant
        </button>
      </div>
    </div>

    <!-- ALERTA -->
    <div id="alert" role="alert"></div>

    <!-- FOOTER -->
    <footer>RePia - Gestio sostenible</footer>

    <!-- SCRIPTS -->
    <script src="js/config.js"></script>
    <script src="js/firestore.js"></script>
    <script src="js/items.js"></script>

    <script>
      // ════════════════════════════════════════════════════════════════
      // VARIABLE GLOBALS PER A LA BOTIGA
      // ════════════════════════════════════════════════════════════════

      // Array on es guarden tots els productes carregats de Firestore
      let allProducts = [];

      // Array on es guarden els articles agregats al carrico
      let cart = [];

      // Variable per guardar temporalment les dades del producte que es mostra en el modal
      let currentProduct = null;

      // ════════════════════════════════════════════════════════════════
      // FUNCIONS PER A CARREGAR PRODUCTES
      // ════════════════════════════════════════════════════════════════

      /**
       * Carrega tots els productes de Firestore i els prepara per a la visualizacio
       */
      async function carregarProductes() {
        try {
          // Obtenim tots els documents de la col·lecció 'items'
          const arrayProducts = await selectAll(items);
          
          // Convertim els snapshots de Firestore a objectes JavaScript normals
          allProducts = arrayProducts.map(doc => ({
            id: doc.id,
            title: doc.data().title || 'Sense titol',
            content: doc.data().content || 'Sense descripcio',
            category: doc.data().category || 'General',
            price: doc.data().price || 0
          }));

          // Actualitzem la llista de categories en el selector
          actualitzarCategories();

          // Mostrem els productes
          mostrarProductes(allProducts);

        } catch (error) {
          console.error('Error carregant productes:', error);
          mostrarAlerta('Error al caregar els productes', 'alert-danger');
        }
      }

      /**
       * Extreu totes les categories uniques i les afegeix al selector de filtro
       */
      function actualitzarCategories() {
        // Obtenim les categories uniques
        const categories = [...new Set(allProducts.map(p => p.category))];
        
        // Accedim al selector HTML
        const filterSelect = document.getElementById('categoryFilter');
        
        // Conservem la primera opcio (totes les categories)
        const firstOption = filterSelect.innerHTML;
        
        // Afegim les categories com a opcions
        categories.forEach(cat => {
          if (cat) { // Ens assegurem que no és buit
            const option = document.createElement('option');
            option.value = cat;
            option.textContent = cat;
            filterSelect.appendChild(option);
          }
        });
      }

      /**
       * Mostra els productes en el grid
       * @param {Array} productes - Array de productes a mostrar
       */
      function mostrarProductes(productes) {
        const grid = document.getElementById('productsGrid');
        
        // Si no hi ha productes, mostrem un missatge
        if (productes.length === 0) {
          grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--grey-2);">No s\'han trobat productes</p>';
          return;
        }

        // Netegem el grid
        grid.innerHTML = '';

        // Iterem cada producte i creem una tarjeta
        productes.forEach(product => {
          const card = document.createElement('div');
          card.className = 'product-card';
          card.onclick = () => obrir_modal_producte(product);

          // Obtenim la primera lletra de la categoria per al placeholder
          const firstLetter = product.category.charAt(0).toUpperCase();

          card.innerHTML = `
            <div class="product-image">${firstLetter}</div>
            <div class="product-info">
              <div class="product-title">${product.title}</div>
              <div class="product-category">${product.category}</div>
              <div class="product-description">${product.content}</div>
              <div class="product-footer">
                <span class="product-price">${formatearPrecio(product.price)}</span>
                <button class="product-btn-add" onclick="event.stopPropagation(); afegirDirectament('${product.id}')">
                  Afegir
                </button>
              </div>
            </div>
          `;

          grid.appendChild(card);
        });
      }

      /**
       * Filtra els productes segons el text de cerca i la categoria seleccionada
       */
      function filtrarProductes() {
        // Obtenim el text de la cerca
        const searchText = document.getElementById('searchInput').value.toLowerCase();
        
        // Obtenim la categoria seleccionada
        const selectedCategory = document.getElementById('categoryFilter').value;

        // Filtrem els productes
        const filtered = allProducts.filter(product => {
          // Filtrem per text (titol o descripcio)
          const matchText = !searchText || 
            product.title.toLowerCase().includes(searchText) ||
            product.content.toLowerCase().includes(searchText);

          // Filtrem per categoria
          const matchCategory = !selectedCategory || product.category === selectedCategory;

          // Retornem true si compleix ambdos filtres
          return matchText && matchCategory;
        });

        // Mostrem els productes filtrats
        mostrarProductes(filtered);
      }

      // ════════════════════════════════════════════════════════════════
      // FUNCIONS PER AL MODAL DE DETALLS
      // ════════════════════════════════════════════════════════════════

      /**
       * Obri el modal amb els detalls del producte seleccionat
       * @param {Object} product - Objecte del producte
       */
      function obrir_modal_producte(product) {
        // Guarden el producte actual en la variable global
        currentProduct = product;

        // Omplim el modal amb les dades del producte
        document.getElementById('modalTitle').textContent = product.title;
        document.getElementById('modalCategory').textContent = product.category;
        document.getElementById('modalDescription').textContent = product.content;
        document.getElementById('modalPrice').textContent = formatearPrecio(product.price);
        
        // Mostrem la primera lletra de la categoria
        const firstLetter = product.category.charAt(0).toUpperCase();
        document.getElementById('modalImage').textContent = firstLetter;

        // Resetejem la quantitat a 1
        document.getElementById('modalQuantity').value = 1;

        // Mostrem el modal
        document.getElementById('productModal').classList.add('show');
      }

      /**
       * Tanca el modal de detalls
       */
      function closeProductModal() {
        document.getElementById('productModal').classList.remove('show');
      }

      /**
       * Incrementa la quantitat en el modal
       */
      function incrementarQuantitat() {
        const input = document.getElementById('modalQuantity');
        input.value = parseInt(input.value) + 1;
      }

      /**
       * Decrementa la quantitat en el modal (minim 1)
       */
      function decrementarQuantitat() {
        const input = document.getElementById('modalQuantity');
        if (parseInt(input.value) > 1) {
          input.value = parseInt(input.value) - 1;
        }
      }

      /**
       * Valida que la quantitat sigui un número valid (minim 1)
       */
      function validarQuantitat() {
        const input = document.getElementById('modalQuantity');
        if (isNaN(input.value) || parseInt(input.value) < 1) {
          input.value = 1;
        }
      }

      // ════════════════════════════════════════════════════════════════
      // FUNCIONS PER AL CARRICO
      // ════════════════════════════════════════════════════════════════

      /**
       * Afegeix un producte al carrico des del modal
       */
      function afegirAlCarrito() {
        if (!currentProduct) return;

        const quantity = parseInt(document.getElementById('modalQuantity').value) || 1;
        agregarAlCarricoInterno(currentProduct, quantity);

        closeProductModal();
        mostrarAlerta('Producte afegit al carrico', 'alert-success');
      }

      /**
       * Afegeix un producte al carrico directament des del buto de la tarjeta
       * @param {string} productId - ID del producte a afegir
       */
      function afegirDirectament(productId) {
        // Busquem el producte en l'array
        const product = allProducts.find(p => p.id === productId);
        if (!product) return;

        // El afegim amb quantitat 1
        agregarAlCarricoInterno(product, 1);
        mostrarAlerta('Producte afegit al carrico', 'alert-success');
      }

      /**
       * Funcio interna per afegir un producte al carrico
       * (s'utilitza tant del modal com del buto directe)
       * @param {Object} product - Objecte del producte
       * @param {number} quantity - Quantitat a afegir
       */
      function agregarAlCarricoInterno(product, quantity) {
        // Busquem si el producte ja existeix en el carrico
        const existingItem = cart.find(item => item.id === product.id);

        if (existingItem) {
          // Si ja existe, sumem la quantitat
          existingItem.quantity += quantity;
        } else {
          // Si no, afegim un nou article
          cart.push({
            id: product.id,
            title: product.title,
            price: product.price,
            quantity: quantity
          });
        }

        // Actualitzem la visualizacio del carrico
        actualizarCarrico();
      }

      /**
       * Actualitza la visualizacio del carrico i els totals
       */
      function actualizarCarrico() {
        // Calculem el nombre total d'articles
        const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);

        // Actualitzem el badge del carrico en el header
        const badge = document.getElementById('carrioBadge');
        if (totalItems > 0) {
          badge.textContent = totalItems;
          badge.style.display = 'flex';
        } else {
          badge.style.display = 'none';
        }

        // Actualitzem el titol del header del carrico
        const cartHeader = document.querySelector('.cart-header h3');
        cartHeader.textContent = 'Carrico (' + totalItems + ')';

        // Actualitzem el contingut dels articles
        const itemsContainer = document.getElementById('cartItemsContainer');

        if (cart.length === 0) {
          // Si el carrico està buit, mostrem missatge
          itemsContainer.innerHTML = '<div class="cart-empty">El carrico està buit</div>';
        } else {
          // Generem HTML per a cada article
          itemsContainer.innerHTML = cart.map((item, index) => `
            <div class="cart-item">
              <div class="cart-item-info">
                <div class="cart-item-title">${item.title}</div>
                <div class="cart-item-price">${formatearPrecio(item.price * item.quantity)}</div>
              </div>
              <div class="cart-item-qty">
                <button onclick="decrementarCartItem(${index})">-</button>
                <span>${item.quantity}</span>
                <button onclick="incrementarCartItem(${index})">+</button>
              </div>
              <button class="cart-item-remove" onclick="eliminarDelCarrico(${index})"></button>
            </div>
          `).join('');
        }

        // Calculem i mostrem el total
        const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
        document.getElementById('cartTotal').textContent = formatearPrecio(total);
      }

      /**
       * Incrementa la quantitat d'un article en el carrico
       * @param {number} index - Posicio del article en l'array cart
       */
      function incrementarCartItem(index) {
        if (cart[index]) {
          cart[index].quantity += 1;
          actualizarCarrico();
        }
      }

      /**
       * Decrementa la quantitat d'un article en el carrico
       * @param {number} index - Posicio del article en l'array cart
       */
      function decrementarCartItem(index) {
        if (cart[index] && cart[index].quantity > 1) {
          cart[index].quantity -= 1;
          actualizarCarrico();
        }
      }

      /**
       * Elimina completament un article del carrico
       * @param {number} index - Posicio del article en l'array cart
       */
      function eliminarDelCarrico(index) {
        cart.splice(index, 1);
        actualizarCarrico();
        mostrarAlerta('Producte eliminat del carrico', 'alert-success');
      }

      /**
       * Obri/tanca el carrico lateral
       */
      function toggleCarrito() {
        document.getElementById('cartSidebar').classList.toggle('show');
      }

      /**
       * Simula una compra (avis: no és funcional, només mostra un missatge)
       */
      function simularCompra() {
        if (cart.length === 0) {
          mostrarAlerta('El carrico està buit', 'alert-danger');
          return;
        }

        // Calculem el total
        const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

        // Mostrem un missatge de confirmacio simulat
        alert('Compra simulada completada!\n\nTotal: ' + formatearPrecio(total) + '\n\nAixo es una simulacio i no es processara cap pagament real.');

        // Vaciarem el carrico
        cart = [];
        actualizarCarrico();
        toggleCarrito();
        mostrarAlerta('Carrico buitât', 'alert-success');
      }

      // ════════════════════════════════════════════════════════════════
      // FUNCIONS AUXILIARS
      // ════════════════════════════════════════════════════════════════

      /**
       * Formatea un número com a preu en euros
       * @param {number} price - Preu a formatar
       * @returns {string} Preu formatat (ex: "19,99€")
       */
      function formatearPrecio(price) {
        return parseFloat(price).toFixed(2).replace('.', ',') + '€';
      }

      /**
       * Mostra una alerta temporal en la pantalla
       * @param {string} text - Text de la alerta
       * @param {string} type - Tipus de alerta ('alert-success' o 'alert-danger')
       */
      function mostrarAlerta(text, type) {
        const alertEl = document.getElementById('alert');
        alertEl.innerText = text;
        alertEl.className = 'alert ' + type;
        alertEl.style.display = 'block';
        
        // Amaguem l'alerta después de 2 segons
        setTimeout(() => {
          alertEl.style.display = 'none';
        }, 2000);
      }

      // ════════════════════════════════════════════════════════════════
      // INICIALITZAR L'APLICACIO EN CARREGAR LA PAGINA
      // ════════════════════════════════════════════════════════════════

      window.addEventListener('load', async () => {
        // Esperem a que Firebase estigui inicialitzat
        await new Promise(resolve => {
          if (firebase.apps.length) {
            resolve();
          } else {
            setTimeout(resolve, 500);
          }
        });

        // Carreguem els productes
        await carregarProductes();
      });

      // Tanquem el modal si fem clic fora (ja s'ha definit en el HTML)
      // però afegim suport per a la tecla 'Escape'
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          closeProductModal();
        }
      });
    </script>
  </body>
</html>
